<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>API Key 数据查询</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22central%22%20text-anchor%3D%22middle%22%20font-size%3D%2256%22%3E%F0%9F%94%91%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <h1>API Key 数据查询</h1>
  <p class="muted">sub2api / 只读观测 / 时间：Asia/Shanghai / 金额：¥</p>
  <form id="lookup" method="post" action="/api/check" autocomplete="off">
    <label for="key">API Key</label>
    <input id="key" name="key" type="password" autocomplete="off" spellcheck="false" maxlength="128" required placeholder="粘贴完整 API Key">
    <button id="submit" type="submit">查询</button>
    <button id="clear" type="button">清空</button>
  </form>
  <p class="muted">Key 仅用于本次查询，不写入浏览器存储。页面刷新后清空。</p>
  <p id="message" role="status" aria-live="polite">等待输入。</p>
  <section id="result" hidden>
    <table><caption>观测结果</caption><tbody id="rows"></tbody></table>
  </section>
</main>
</body>
</html>
